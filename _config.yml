title: Ministry of Fixing Civilisation
tagline: One small fix. Thousands of human years. Every day.
description: >-
  How much of everyone's life is wasted by small problems on our screens,
  counted in human lifetimes per year. Simple sums, sources shown, and an
  honest guess at how hard each one would be to fix.

# Served from a custom subdomain root, so baseurl is empty.
# (It would be "/ux" only if served from planetarycouncil.github.io/ux.)
baseurl: ""
# Must match CNAME. It feeds canonical, og:url and og:image on every page, so a
# stale value here points search engines and link previews at a dead host while
# the site itself serves fine — nothing on the page looks wrong.
url: "https://ux.planetarycouncil.org"
repo: "https://github.com/PlanetaryCouncil/ux"

collections:
  cases:
    output: true
    permalink: /cases/:name/

defaults:
  - scope:
      path: ""
      type: cases
    values:
      layout: case

exclude:
  - ROADMAP.md
  - BACKLOG.md
  - README.md
  - DEVELOPMENT.md
  - Makefile
  - Gemfile
  - Gemfile.lock
  - vendor
